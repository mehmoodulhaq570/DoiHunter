[metadata]
name = doi-hunter
version = attr: doi_hunter.__version__
description = Resolve paper titles and download available research PDFs
long_description = file: README.md
long_description_content_type = text/markdown
author = Mehmood Ul Haq
author_email = mehmoodulhaq1040@gmail.com
url = https://github.com/mehmoodulhaq570/DoiHunter
license = MIT
license_files = LICENSE.txt
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Operating System :: OS Independent
project_urls =
    Documentation = https://github.com/mehmoodulhaq570/DoiHunter#readme
    Source = https://github.com/mehmoodulhaq570/DoiHunter
    Bug Tracker = https://github.com/mehmoodulhaq570/DoiHunter/issues

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    requests>=2.25.1
    beautifulsoup4>=4.9.3

[options.entry_points]
console_scripts =
    doi-hunter = doi_hunter.__main__:main

[options.extras_require]
dev =
    black
    build
    twine
